name: Actualizar partidos

on:
  schedule:
    - cron: "0 11 * * 1"   # todos los lunes a las 5:00 a.m. de Costa Rica
  workflow_dispatch:        # también se puede correr a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar partidos (Fixtur.es y ESPN)
        continue-on-error: true
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          python actualizar_partidos.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add fixtures.json || exit 0
          git diff --staged --quiet || git commit -m "Partidos actualizados $(date -u +%Y-%m-%d)"
          git push
